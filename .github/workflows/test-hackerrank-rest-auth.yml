name: Test HackerRank REST Authentication

# Read-only authentication/submission probe. It does not create submissions or modify the account.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test authenticated HackerRank access
        env:
          HACKERRANK_SESSION_ID: ${{ secrets.HACKERRANK_SESSION_ID }}
          HACKERRANK_EMAIL: ${{ secrets.HACKERRANK_EMAIL }}
          HACKERRANK_PASSWORD: ${{ secrets.HACKERRANK_PASSWORD }}
        run: python scripts/test_hackerrank_rest_auth.py
