name: Test HackerRank Authentication

# Read-only authentication and submission-page access check for HackerRank Community.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hackerrank-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check HackerRank credentials are configured
        env:
          HACKERRANK_EMAIL: ${{ secrets.HACKERRANK_EMAIL }}
          HACKERRANK_PASSWORD: ${{ secrets.HACKERRANK_PASSWORD }}
        run: |
          test -n "$HACKERRANK_EMAIL" || { echo "HACKERRANK_EMAIL secret is missing."; exit 1; }
          test -n "$HACKERRANK_PASSWORD" || { echo "HACKERRANK_PASSWORD secret is missing."; exit 1; }

      - name: Run read-only HackerRank access test
        env:
          HACKERRANK_EMAIL: ${{ secrets.HACKERRANK_EMAIL }}
          HACKERRANK_PASSWORD: ${{ secrets.HACKERRANK_PASSWORD }}
        run: python scripts/test_hackerrank_auth.py

      - name: Upload HackerRank login diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hackerrank-login-diagnostics
          path: hackerrank-login-diagnostics/
          if-no-files-found: ignore
