name: One-time Full System Test

on:
  push:
    paths:
      - "tests/test_sync_runner.py"

permissions:
  contents: write

jobs:
  full-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run all regression tests
        run: python -m pytest -q

      - name: Diagnose CodeChef problem page
        env:
          CODECHEF_USERNAME: ${{ secrets.CODECHEF_USERNAME }}
          CODECHEF_PASSWORD: ${{ secrets.CODECHEF_PASSWORD }}
        run: |
          python - <<'PY'
          import time
          from scripts import codechef_adapter as cc
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.support.ui import WebDriverWait

          username, password = cc._credentials()
          driver = cc.build_driver()
          try:
              cc._login(driver, username, password)
              driver.get(f"{cc.BASE_URL}/problems/DSACPR45")
              WebDriverWait(driver, 25).until(EC.presence_of_element_located((By.TAG_NAME, "body")))
              time.sleep(8)
              print(f"URL={driver.current_url}")
              print(f"TITLE={driver.title}")
              body_text = driver.execute_script("return document.body ? document.body.innerText : ''")
              print("=== BODY TEXT ===")
              print((body_text or "")[:8000])
              print("=== PROBLEM ELEMENTS ===")
              data = driver.execute_script("""
                  const selectors = [
                    'main','article','section','#problem-statement','.problem-statement',
                    '[class*="problem"]','[id*="problem"]','[data-testid*="problem"]'
                  ];
                  const out = {};
                  for (const selector of selectors) {
                    out[selector] = Array.from(document.querySelectorAll(selector)).slice(0, 5).map(el => ({
                      tag: el.tagName,
                      id: el.id,
                      className: typeof el.className === 'string' ? el.className : '',
                      text: (el.innerText || '').slice(0, 2000),
                      html: el.outerHTML.slice(0, 5000)
                    }));
                  }
                  return out;
              """)
              for selector, nodes in data.items():
                  print(f"--- {selector}: {len(nodes)} ---")
                  for node in nodes:
                      print(node)
              print("=== BODY HTML MARKERS ===")
              html = driver.execute_script("return document.documentElement.outerHTML")
              for marker in ["DSACPR45", "Problem Statement", "Task", "Input", "Output", "Constraints", "Explanation", "Sum of Array"]:
                  index = html.lower().find(marker.lower())
                  print(f"{marker}: {index}")
                  if index >= 0:
                      print(html[max(0, index - 500):index + 2500])
          finally:
              driver.quit()
          PY

      - name: Configure Git identity
        run: |
          git config user.name "Lakshay-M07"
          git config user.email "222706893+Lakshay-M07@users.noreply.github.com"

      - name: Run full synchronizer end-to-end
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          CODECHEF_USERNAME: ${{ secrets.CODECHEF_USERNAME }}
          CODECHEF_PASSWORD: ${{ secrets.CODECHEF_PASSWORD }}
          HACKERRANK_SESSION: ${{ secrets.HACKERRANK_SESSION }}
        run: python scripts/sync_runner.py

      - name: Verify working tree
        run: git status --short
