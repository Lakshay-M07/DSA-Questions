name: Sync Accepted DSA Submissions

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dsa-submission-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run local regression tests
        run: python -m pytest -q

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test LeetCode authentication (read-only)
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/test_leetcode_auth.py

      - name: Test CodeChef authentication and recent submissions (read-only)
        env:
          CODECHEF_USERNAME: ${{ secrets.CODECHEF_USERNAME }}
          CODECHEF_PASSWORD: ${{ secrets.CODECHEF_PASSWORD }}
        run: |
          test -n "$CODECHEF_USERNAME" || { echo "CODECHEF_USERNAME secret is missing."; exit 1; }
          test -n "$CODECHEF_PASSWORD" || { echo "CODECHEF_PASSWORD secret is missing."; exit 1; }
          python - <<'PY'
          from scripts.codechef_adapter import fetch_recent_accepted
          items = fetch_recent_accepted(20)
          print(f"CodeChef recent accepted submissions returned: {len(items)}")
          for item in items:
              print(f"CodeChef submission: {item.problem_id} / {item.language} / {item.submission_id}")
          PY

      - name: Test HackerRank authentication and submissions (read-only)
        env:
          HACKERRANK_EMAIL: ${{ secrets.HACKERRANK_EMAIL }}
          HACKERRANK_PASSWORD: ${{ secrets.HACKERRANK_PASSWORD }}
          HACKERRANK_SESSION_ID: ${{ secrets.HACKERRANK_SESSION_ID }}
        run: python scripts/test_hackerrank_rest_auth.py

      - name: Sync LeetCode and CodeChef accepted submissions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          CODECHEF_USERNAME: ${{ secrets.CODECHEF_USERNAME }}
          CODECHEF_PASSWORD: ${{ secrets.CODECHEF_PASSWORD }}
        run: python -m scripts.leetcode_sync_runner

      - name: Sync HackerRank accepted submissions
        env:
          HACKERRANK_EMAIL: ${{ secrets.HACKERRANK_EMAIL }}
          HACKERRANK_PASSWORD: ${{ secrets.HACKERRANK_PASSWORD }}
          HACKERRANK_SESSION_ID: ${{ secrets.HACKERRANK_SESSION_ID }}
        run: python -m scripts.hackerrank_sync_runner

      - name: Generate repository dashboard
        run: |
          python -m scripts.dashboard_generator
          if git diff --quiet -- README.md; then
            echo "Dashboard is already up to date."
          else
            git add README.md
            git commit -m "docs: update DSA progress dashboard"
            git push
          fi

      - name: Verify repository state
        run: git status --short
