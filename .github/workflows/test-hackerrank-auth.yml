name: Test HackerRank Authentication

# Read-only authentication and submission access check for HackerRank Community.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hackerrank-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check HackerRank session secret is configured
        env:
          HACKERRANK_SESSION_ID: ${{ secrets.HACKERRANK_SESSION_ID }}
        run: |
          test -n "$HACKERRANK_SESSION_ID" || { echo "HACKERRANK_SESSION_ID secret is missing."; exit 1; }

      - name: Run read-only HackerRank access test
        env:
          HACKERRANK_SESSION_ID: ${{ secrets.HACKERRANK_SESSION_ID }}
          HACKERRANK_EMAIL: ${{ secrets.HACKERRANK_EMAIL }}
          HACKERRANK_PASSWORD: ${{ secrets.HACKERRANK_PASSWORD }}
        run: python scripts/test_hackerrank_rest_auth.py
