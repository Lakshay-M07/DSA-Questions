name: Test HackerRank Adapter

on:
  push:
    paths:
      - 'scripts/hackerrank_adapter.py'
      - 'scripts/hackerrank_sync_runner.py'
      - 'tests/test_hackerrank_adapter.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_hackerrank_adapter.py
