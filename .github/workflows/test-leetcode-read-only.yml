name: Test LeetCode Read-Only Fetch

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/test_leetcode_structure.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run LeetCode structure tests
        run: python -m pytest -q tests/test_leetcode_structure.py

      - name: Test authenticated LeetCode fetch
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/sync_submissions.py --leetcode-read-only
