name: Sync Accepted DSA Submissions

on:
  schedule:
    # Run every 20 minutes, offset from the top of the hour to reduce queue contention.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dsa-submission-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sync accepted submissions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          CODECHEF_USERNAME: ${{ secrets.CODECHEF_USERNAME }}
          CODECHEF_PASSWORD: ${{ secrets.CODECHEF_PASSWORD }}
          HACKERRANK_SESSION: ${{ secrets.HACKERRANK_SESSION }}
        run: python scripts/sync_submissions.py

      - name: Show repository changes
        run: git status --short

      - name: Commit and push synced solutions
        run: |
          git config user.name "Lakshay-M07"
          git config user.email "222706893+Lakshay-M07@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No new accepted submissions to commit."
            exit 0
          fi

          git add .
          git commit -m "chore: sync accepted DSA submissions"
          git push
