name: Test CodeChef Authentication

# Read-only authentication check for CodeChef.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codechef-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check CodeChef credentials are configured
        env:
          CODECHEF_USERNAME: ${{ secrets.CODECHEF_USERNAME }}
          CODECHEF_PASSWORD: ${{ secrets.CODECHEF_PASSWORD }}
        run: |
          test -n "$CODECHEF_USERNAME" || { echo "CODECHEF_USERNAME secret is missing."; exit 1; }
          test -n "$CODECHEF_PASSWORD" || { echo "CODECHEF_PASSWORD secret is missing."; exit 1; }

      - name: Run read-only CodeChef fetch
        env:
          CODECHEF_USERNAME: ${{ secrets.CODECHEF_USERNAME }}
          CODECHEF_PASSWORD: ${{ secrets.CODECHEF_PASSWORD }}
        run: |
          python - <<'PY'
          from scripts.codechef_adapter import fetch_recent_accepted

          items = fetch_recent_accepted(20)
          print(f"Recent Accepted submissions found: {len(items)}")
          for x in items:
              print(f"{x.submission_id} | {x.problem_id} | {x.language} | {x.source_url}")
          PY
