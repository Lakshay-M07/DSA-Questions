name: Test HackerRank Client Live

on:
  push:
    paths:
      - 'scripts/hackerrank_adapter.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify current authenticated HackerRank REST client
        env:
          HACKERRANK_EMAIL: ${{ secrets.HACKERRANK_EMAIL }}
          HACKERRANK_PASSWORD: ${{ secrets.HACKERRANK_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from scripts.hackerrank_adapter import HackerRankClient, parse_submission, extract_problem_metadata

          client = HackerRankClient(os.environ['HACKERRANK_EMAIL'], os.environ['HACKERRANK_PASSWORD'])
          records = client.fetch_submissions(limit=10)
          print(f"Current submission records: {len(records)}")
          print(f"Current accepted records: {sum(parse_submission(x) is not None for x in records)}")

          challenge = client.fetch_challenge('solve-me-first')
          title, difficulty, category, tags, description = extract_problem_metadata(challenge)
          print(f"Challenge metadata reachable: title={title!r}, difficulty={difficulty!r}, category={category!r}, tags={tags!r}")
          print(f"Challenge description present: {bool(description)}")
          print('HackerRank current-client smoke test passed.')
          PY
